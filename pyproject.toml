[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "champ-diff"
version = "0.1.0"
description = "Discord bot that sends League of Legends champion stat diffs between patches."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0,<3.0",
  "requests>=2.31,<3.0",
  "discord.py>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "pytest-asyncio>=0.24",
  "responses>=0.25",
]

[tool.setuptools]
packages = ["app", "services"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"